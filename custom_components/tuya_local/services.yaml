refresh_devices:
  fields: {}

relocate_devices:
  name: Relocate devices
  description: >-
    Find configured devices whose LAN address changed and update it. Each new
    address is confirmed by the device's MAC address and device id first, so a
    device that is only temporarily unreachable is left alone. Returns the
    devices that were relocated, those that could not be confirmed, and those
    that were not found on the network at all.
  fields: {}

add_device:
  name: Add device from mobile app
  description: Create or update a local device using credentials from the Smarthome / Tuya App SDK
  fields:
    device_id:
      required: true
      example: bfxxxxxxxx
      selector:
        text:
    local_key:
      required: true
      selector:
        text:
    host:
      example: 192.168.1.50
      selector:
        text:
    product_id:
      selector:
        text:
    name:
      selector:
        text:
    protocol_version:
      default: auto
      example: auto
      selector:
        text:
    poll_only:
      default: false
      selector:
        boolean:

list_configured:
  name: List configured devices
  description: Return device_id/host for mobile sync UI
  fields: {}

sync_cloud_session:
  name: Sync cloud session from mobile app
  description: Store App SDK / OpenAPI or sharing auth for later refresh
  fields:
    payload:
      required: true
      selector:
        object:

send_learned_ir_command:
  target:
    entity:
      domain: remote
      integration: tuya_local
  fields:
    command:
      required: true
      example: "Play"
      selector:
        object:
    device:
      example: "TV"
      selector:
        text:
    emitter_entity_id:
      example: "infrared.my_ir_emitter"
      required: true
      selector:
        entity:
          filter:
            domain: infrared

add_all_devices:
  name: Add all devices from the Tuya account
  description: >-
    Plan and add every device of the connected Tuya cloud account in one go.
    Devices already configured, hubs (and their sub-devices), devices without a
    local key, devices the cloud marks cloud-only, devices with no LAN address,
    and devices whose product id matches no device config are skipped and
    reported with a reason. With dry_run (the default) nothing is created and the
    plan is returned so it can be reviewed first.
  fields:
    dry_run:
      name: Dry run
      description: Only return the plan, create nothing
      default: true
      selector:
        boolean:
    include_unreachable:
      name: Include unreachable
      description: >-
        Also add devices that are not answering on the LAN right now (they come
        up when they are powered on)
      default: true
      selector:
        boolean:

logout_cloud:
  name: Logout from the Tuya cloud
  description: >-
    Forget the saved Tuya cloud login (memory and disk). Device control is local,
    so every configured device keeps working; what is removed is the cloud side:
    the account that labels discovered devices and supplies the local keys
    offered when adding a device. Add a device through the cloud path afterwards
    to log in again, with the same or another account.
  fields: {}
