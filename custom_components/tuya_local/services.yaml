refresh_devices:
  fields: {}

relocate_devices:
  name: Relocate devices
  description: >-
    Find configured devices whose LAN address changed and update it. Each new
    address is confirmed by the device's MAC address and device id first, so a
    device that is only temporarily unreachable is left alone. Returns the
    devices that were relocated, those that could not be confirmed, and those
    that were not found on the network at all.
  fields: {}

add_device:
  name: Add device from mobile app
  description: Create or update a local device using credentials from the Smarthome / Tuya App SDK
  fields:
    device_id:
      required: true
      example: bfxxxxxxxx
      selector:
        text:
    local_key:
      required: true
      selector:
        text:
    host:
      example: 192.168.1.50
      selector:
        text:
    product_id:
      selector:
        text:
    name:
      selector:
        text:
    protocol_version:
      default: auto
      example: auto
      selector:
        text:
    poll_only:
      default: false
      selector:
        boolean:

list_configured:
  name: List configured devices
  description: Return device_id/host for mobile sync UI
  fields: {}

sync_cloud_session:
  name: Sync cloud session from mobile app
  description: >-
    Store an App SDK / OpenAPI session, or a Tuya sharing login as a cloud
    account. A sharing login (payload with token_info/user_code/endpoint) is
    stored as (or refreshed into) the account named by label/account_id, so the
    app can push one login per Tuya account.
  fields:
    payload:
      required: true
      selector:
        object:
    label:
      name: Account label
      description: Name to store the account under (sharing logins only)
      selector:
        text:
    account_id:
      name: Account id
      description: Update this account instead of matching by user code
      selector:
        text:

send_learned_ir_command:
  target:
    entity:
      domain: remote
      integration: tuya_local
  fields:
    command:
      required: true
      example: "Play"
      selector:
        object:
    device:
      example: "TV"
      selector:
        text:
    emitter_entity_id:
      example: "infrared.my_ir_emitter"
      required: true
      selector:
        entity:
          filter:
            domain: infrared

account_list:
  name: List Tuya cloud accounts
  description: >-
    Return every connected Tuya cloud account (id, label, user code, which one
    is active). Tokens are never returned.
  fields: {}

account_login_start:
  name: Start Tuya account login
  description: >-
    Begin a QR login for one Tuya app account. Returns the qr token and the
    qr_payload string to render as a QR code and scan with the Tuya/SmartLife
    app; then call account_login_finish.
  fields:
    user_code:
      name: User code
      description: The account's user code, shown in the Tuya app account page
      required: true
      selector:
        text:
    label:
      name: Account label
      selector:
        text:
    account_id:
      name: Account id
      description: Re-authenticate this existing account instead of a new one
      selector:
        text:

account_login_finish:
  name: Finish Tuya account login
  description: >-
    Complete a login started with account_login_start, once the QR code has been
    scanned. Returns the stored account, or retry=true when the app has not
    confirmed yet (call it again).
  fields:
    account_id:
      name: Account id
      description: The account_id returned by account_login_start
      required: true
      selector:
        text:
    label:
      name: Account label
      selector:
        text:

account_rename:
  name: Rename Tuya cloud account
  fields:
    account_id:
      required: true
      selector:
        text:
    label:
      name: New label
      required: true
      selector:
        text:

account_set_active:
  name: Set active Tuya cloud account
  description: The active account is used by default to add devices and read names
  fields:
    account_id:
      required: true
      selector:
        text:

account_remove:
  name: Remove Tuya cloud account
  description: Delete a stored Tuya cloud account (does not touch its devices)
  fields:
    account_id:
      required: true
      selector:
        text:
